# Visual Player's key bindings.
#
# mpv's standard bindings still work for anything not listed here.
# See docs/plan.md, section 9.

## Playback

SPACE        cycle pause
LEFT         seek -5
RIGHT        seek 5
UP           add volume 5
DOWN         add volume -5
WHEEL_UP     add volume 5
WHEEL_DOWN   add volume -5

## Fullscreen
# People reach for different keys out of habit, so all of these work.

f            cycle fullscreen
F11          cycle fullscreen
Alt+ENTER    cycle fullscreen
MBTN_LEFT_DBL cycle fullscreen
ESC          set fullscreen no

## Tracks

c            cycle sub
a            cycle audio

## Video

# Rotate a quarter turn each press, then back to normal.
r            cycle-values video-rotate 90 180 270 0

## Panels

# The info panel. Shift+I still opens mpv's own detailed statistics.
i            script-binding visual_player/toggle-info-panel

# Where the sound and picture are going, and switching the sound output.
o            script-binding visual_player/toggle-output-popup

