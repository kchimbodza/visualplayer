# Visual Player's default mpv settings.
#
# These are loaded before the user's personal settings in
# ~/.config/visual-player/mpv.conf, so users can override anything here.
# See docs/plan.md, section 8, for the reasoning behind each choice.

## Video

# gpu-next is mpv's modern renderer. It's needed for HDR output on
# Wayland and gives the best tone mapping on SDR screens.
vo=gpu-next
gpu-api=vulkan

# Use hardware decoding when it's known to be reliable, otherwise the CPU.
hwdec=auto-safe

# Tell the compositor what kind of video this is, so HDR screens can
# switch into HDR properly.
target-colorspace-hint=yes

# Time video to the audio clock (mpv's default). Phase 0 showed that
# display-resample badly hurts smoothness on screens with unsteady refresh
# timing: 237 dropped frames in 59 seconds versus 1 in 74 seconds.
video-sync=audio

## Audio

# Output as many channels as the audio device accepts.
audio-channels=auto

# Passthrough (audio-spdif) is deliberately not set here. It will be
# turned on per device by the output menu in Phase 4, because sending
# Atmos to a device that can't decode it produces silence or noise.

## Window

title=${media-title} — Visual Player

# Never open a window smaller than 240p. Visual Player's window_size.lua
# also stops it being resized smaller than this later, since mpv has no
# setting for that.
# Open every video at about 70% of the screen, fitted to its shape, so a
# 4K file doesn't overflow the screen and an SD file isn't a tiny box.
autofit=70%x70%
autofit-smaller=426x240

# Keep the window open at the end of a file instead of closing.
keep-open=yes

# Remember where each file was left off.
save-position-on-quit=yes

## Interface

# Visual Player's bundled text font (see tools/update-text-font.py), so
# the interface looks the same on every system.
osd-font=Inter

# mpv's built-in controls stay on until Phase 2, step 6, when Visual
# Player's own interface has fully replaced them. At that point these
# become osc=no and border=no.
osc=yes

# Visual Player's top bar now acts as the title bar, so turn off the
# stand-in title bar mpv's controls draw when a window has no border.
script-opts-append=osc-windowcontrols=no
